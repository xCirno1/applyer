name: CI

on:
  push:
    branches: [main, release-test]
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts skips postinstall's electron-rebuild + Chromium
      # download: neither is needed here. better-sqlite3 ships prebuilt
      # N-API binaries in the package itself (no native compile required to
      # even import it), and nothing in this job touches node-pty, a real
      # Electron runtime, or a real browser.
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same --ignore-scripts reasoning as the jobs above: electron-vite only
      # bundles, and every native dependency is externalized rather than
      # loaded, so nothing here needs a rebuilt binary or a real browser.
      - run: npm ci --ignore-scripts
      # Typecheck and lint both pass on things this does not: the Rollup input
      # graph, the preload's forced-CJS output, and the closeBundle hook that
      # copies drizzle's migration .sql files into out/main. A break in any of
      # those only shows up at package time otherwise.
      - run: npm run build
