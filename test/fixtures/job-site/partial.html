<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partial application | Applyer test site</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <h1>Partially supported application</h1>
    <form>
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName">

      <label for="email">Email</label>
      <input id="email" name="email" type="email">

      <label for="eligibility">Why are you interested in this role?</label>
      <textarea id="eligibility" name="eligibility"></textarea>

      <label for="start-date">Earliest start date</label>
      <input id="start-date" name="startDate" type="date">

      <label for="sponsorship">Will you require sponsorship?</label>
      <select id="sponsorship" name="sponsorship">
        <option value="">Choose one</option>
        <option>No</option>
        <option>Yes</option>
      </select>
    </form>
  </body>
</html>
