<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unsupported application | Applyer test site</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <h1>Unsupported application</h1>
    <p class="hint">None of these controls match Applyer's supported standard fields.</p>
    <form>
      <label for="favorite-color">Favorite color</label>
      <input id="favorite-color" name="favoriteColor">

      <label for="essay">Describe your ideal team</label>
      <textarea id="essay" name="essay"></textarea>

      <label for="availability">Availability</label>
      <select id="availability" name="availability">
        <option>Immediately</option>
        <option>Next month</option>
      </select>
    </form>
  </body>
</html>
